[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fairshortlist"
version = "1.0.0"
description = "Explainable, blind resume screening for recruiters and staffing firms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chandini Pradhan" }]
dependencies = [
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5", "reportlab>=4.0", "httpx>=0.27"]

[project.scripts]
fairshortlist = "fairshortlist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["fairshortlist"]
