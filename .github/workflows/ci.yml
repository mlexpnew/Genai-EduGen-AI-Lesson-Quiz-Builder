name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api,app]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Benchmark (fails below 90% R-precision or any fairness change)
        run: |
          set +e
          python -m hirelens.evaluate --gate
          code=$?
          cat eval_results/report.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: eval_results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test the API image
        run: |
          docker build -t hirelens .
          docker run -d -p 8000:8000 --name api hirelens
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
